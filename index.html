<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ask Martta</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #F5F5F5;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 48px 24px;
      font-family: 'SF Mono', Menlo, 'Cascadia Code', Consolas, 'Courier New', monospace;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.6;
      letter-spacing: -0.01em;
      color: #1C1C1E;
    }

    #window {
      width: 100%;
      max-width: 640px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      border: 1px solid rgba(0,0,0,0.12);
    }

    #titlebar {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 28px;
      background: linear-gradient(to bottom, #ECECEC, #E0E0E0);
      border-bottom: 1px solid #C8C8C8;
      user-select: none;
    }
    #titlebar span {
      font-family: -apple-system, 'Helvetica Neue', sans-serif;
      font-size: 12px;
      font-weight: 500;
      color: rgba(0,0,0,0.5);
      letter-spacing: -0.01em;
    }

    #terminal {
      background: #FFFFFF;
      padding: 12px 16px 16px;
      cursor: text;
    }

    .last-login { color: rgba(0,0,0,0.4); margin-bottom: 16px; }
    .greeting   { margin-bottom: 6px; }

    .ps1-green { color: #1E8C3A; }
    .ps1-text  { color: #1C1C1E; }

    #prompts, #prompts-after { margin-bottom: 6px; }
    #messages { margin-bottom: 2px; }
    .msg { margin-bottom: 2px; }

    .prompt-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 1px 16px;
      margin-left: -16px;
      width: calc(100% + 32px);
      background: none;
      border: none;
      color: #1C1C1E;
      font-family: inherit;
      font-size: inherit;
      font-weight: inherit;
      line-height: inherit;
      letter-spacing: inherit;
      text-align: left;
      cursor: default;
    }
    .prompt-item:hover,
    .prompt-item.default-active { background: rgba(0,0,0,0.05); }
    .prompt-item .arrow { width: 12px; flex-shrink: 0; color: #1E8C3A; }

    #input-line { display: flex; align-items: center; }
    #input-line input {
      background: transparent;
      border: none;
      outline: none;
      font-family: inherit;
      font-size: inherit;
      font-weight: inherit;
      line-height: inherit;
      letter-spacing: inherit;
      color: #1C1C1E;
      caret-color: #1C1C1E;
      cursor: default;
      width: 0;
      min-width: 1px;
    }

    #cursor {
      display: inline-block;
      width: 1px;
      height: 14px;
      background: #1C1C1E;
      vertical-align: text-bottom;
      margin-left: 1px;
      flex-shrink: 0;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  </style>
</head>
<body>

  <div id="window">
    <div id="titlebar">
      <span>martta@askHerAnything — zsh</span>
    </div>

    <div id="terminal">
      <div class="last-login" id="last-login">Last login: … from …</div>

      <div class="greeting">
        <span class="ps1-green">martta</span><span class="ps1-text">@askHerAnything ~ % </span><span>ask me anything about Martta Xu.</span>
      </div>

      <div id="prompts"></div>
      <div id="messages"></div>
      <div id="prompts-after"></div>

      <div id="input-line">
        <span class="ps1-green">martta</span><span class="ps1-text">@askHerAnything ~ % </span>
        <input id="input" type="text" autocomplete="off" spellcheck="false" />
        <span id="cursor"></span>
      </div>
    </div>
  </div>

  <script>
    const ALL_PROMPTS = [
      "What are you working on now?",
      "Are you open to new roles?",
      "What's your design process like?",
      "What tools do you use?",
      "Where are you based?",
      "How can I reach you?",
      "What kind of work excites you most?",
    ];

    const RESPONSES = {
      "What are you working on now?":
        "Designing at Datalign, a fast-growing fintech building AI for wealth management. I'm their second design hire, building everything from the ground up.",
      "Are you open to new roles?":
        "Actively looking for full-time product design roles. Feel free to reach out.",
      "What's your design process like?":
        "Honestly, it depends on the problem. I used to live in Figma for everything, but lately I go straight to Claude Code for early exploration and sometimes even shipment.",
      "What tools do you use?":
        "Figma for most visual work. Claude Code and Codex when I need to prototype in the browser. Obsidian as my second brain, replacing Notion entirely.",
      "Where are you based?":
        "Based in Boston. Genuinely excited to relocate, open to anywhere the work is interesting.",
      "How can I reach you?":
        "Best way is email at martta.xu@outlook.com. Also on LinkedIn and I respond to every message.",
      "What kind of work excites you most?":
        "Problems where the design is the product. AI interfaces, new interaction patterns, tools that help people think. Less interested in pixel-pushing, more in figuring out what the thing should even be.",
    };

    function getResponse(text) {
      if (RESPONSES[text]) return RESPONSES[text];
      const q = text.toLowerCase();
      if (/working on|datalign|current/.test(q))       return RESPONSES["What are you working on now?"];
      if (/open|role|job|hire|opportunit/.test(q))      return RESPONSES["Are you open to new roles?"];
      if (/process|how do you work/.test(q))            return RESPONSES["What's your design process like?"];
      if (/tool|figma|software|stack|code/.test(q))     return RESPONSES["What tools do you use?"];
      if (/based|location|where|city|boston/.test(q))   return RESPONSES["Where are you based?"];
      if (/contact|email|reach|talk/.test(q))           return RESPONSES["How can I reach you?"];
      if (/excite|interest|kind of work/.test(q))       return RESPONSES["What kind of work excites you most?"];
      return "Good question - I didn't pre-program that one. Try martta.xu@outlook.com if you're genuinely curious.";
    }

    function getRandomPrompts(asked) {
      const remaining = ALL_PROMPTS.filter(p => !asked.has(p));
      if (remaining.length <= 4) return remaining;
      return [...remaining].sort(() => Math.random() - 0.5).slice(0, 4);
    }

    (function setLastLogin() {
      const d = new Date();
      const ts = d.toLocaleString('en-US', {
        weekday:'short', month:'short', day:'numeric',
        hour:'2-digit', minute:'2-digit', second:'2-digit', hour12: false
      }).replace(',','');
      document.getElementById('last-login').textContent = `Last login: ${ts} from ttys003`;
      fetch('https://ipapi.co/json/')
        .then(r => r.json())
        .then(d => { if (d.city) document.getElementById('last-login').textContent = `Last login: ${ts} from ${d.city}`; })
        .catch(() => {});
    })();

    const asked = new Set();
    let hasHovered = false;
    let started = false;
    let isTyping = false;

    function makePromptBtn(p, isDefault) {
      const btn = document.createElement('button');
      btn.className = 'prompt-item' + (isDefault ? ' default-active' : '');
      btn.innerHTML = `<span class="arrow">${isDefault ? '❯' : ' '}</span><span class="label"></span>`;
      btn.addEventListener('mouseenter', () => {
        btn.querySelector('.arrow').textContent = '❯';
        btn.classList.add('default-active');
      });
      btn.addEventListener('mouseleave', () => {
        btn.querySelector('.arrow').textContent = ' ';
        btn.classList.remove('default-active');
      });
      btn.addEventListener('click', () => send(p));
      return btn;
    }

    function buildPromptButtons(container, prompts, animate) {
      container.innerHTML = '';
      if (!animate) {
        prompts.forEach((p, i) => {
          const isDefault = i === 0 && !hasHovered && !started;
          const btn = makePromptBtn(p, isDefault);
          btn.querySelector('.label').textContent = p;
          container.appendChild(btn);
        });
        return;
      }

      // type each prompt one by one
      let delay = 0;
      prompts.forEach((p) => {
        const btn = makePromptBtn(p, false);
        const label = btn.querySelector('.label');
        container.appendChild(btn);
        const startDelay = delay;
        delay += p.length * 18 + 80;
        setTimeout(() => {
          let i = 0;
          const iv = setInterval(() => {
            i++;
            label.textContent = p.slice(0, i);
            if (i >= p.length) clearInterval(iv);
          }, 18);
        }, startDelay);
      });
    }

    buildPromptButtons(document.getElementById('prompts'), getRandomPrompts(asked), false);

    const messagesEl     = document.getElementById('messages');
    const promptsAfterEl = document.getElementById('prompts-after');
    const inputEl        = document.getElementById('input');
    const cursorEl       = document.getElementById('cursor');
    const promptsEl      = document.getElementById('prompts');
    const terminalEl     = document.getElementById('terminal');

    terminalEl.addEventListener('click', () => inputEl.focus());
    inputEl.addEventListener('focus', () => cursorEl.style.display = 'none');
    inputEl.addEventListener('blur',  () => cursorEl.style.display = 'inline-block');
    inputEl.addEventListener('input', () => { inputEl.style.width = Math.max(0, inputEl.value.length) + 'ch'; });
    inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') send(inputEl.value); });

    function ps1() {
      return `<span class="ps1-green">martta</span><span class="ps1-text">@askHerAnything ~ % </span>`;
    }

    function send(text) {
      text = text.trim();
      if (!text || isTyping) return;
      isTyping = true;
      started = true;

      if (ALL_PROMPTS.includes(text)) asked.add(text);

      promptsEl.innerHTML = '';
      promptsAfterEl.innerHTML = '';
      inputEl.value = '';
      inputEl.style.width = '0ch';

      const userDiv = document.createElement('div');
      userDiv.className = 'msg';
      userDiv.innerHTML = ps1() + escHtml(text);
      messagesEl.appendChild(userDiv);

      setTimeout(() => {
        const response = getResponse(text);
        const botDiv = document.createElement('div');
        botDiv.className = 'msg';
        messagesEl.appendChild(botDiv);

        let i = 0;
        const interval = setInterval(() => {
          i++;
          botDiv.textContent = response.slice(0, i);
          if (i >= response.length) {
            clearInterval(interval);
            isTyping = false;
            const next = getRandomPrompts(asked);
            if (next.length > 0) buildPromptButtons(promptsAfterEl, next, true);
          }
        }, 18);
      }, 150);
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  </script>
</body>
</html>

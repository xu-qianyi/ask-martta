<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ask Martta</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #F5F5F5;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 48px 24px;
      font-family: 'SF Mono', Menlo, 'Cascadia Code', Consolas, 'Courier New', monospace;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.6;
      letter-spacing: -0.01em;
      color: #1C1C1E;
    }

    /* macOS window */
    #window {
      width: 100%;
      max-width: 640px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      border: 1px solid rgba(0,0,0,0.12);
    }

    /* Title bar */
    #titlebar {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      height: 28px;
      background: linear-gradient(to bottom, #ECECEC, #E0E0E0);
      border-bottom: 1px solid #C8C8C8;
      user-select: none;
      flex-shrink: 0;
    }
    #traffic-lights {
      position: absolute;
      left: 12px;
      display: flex;
      gap: 7px;
      align-items: center;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.15);
    }
    #titlebar span {
      font-family: -apple-system, 'Helvetica Neue', sans-serif;
      font-size: 12px;
      font-weight: 500;
      color: rgba(0,0,0,0.5);
      letter-spacing: -0.01em;
    }

    /* Terminal content */
    #terminal {
      background: #FFFFFF;
      padding: 12px 16px 16px;
      cursor: text;
    }

    .last-login { color: rgba(0,0,0,0.4); margin-bottom: 16px; }
    .greeting   { margin-bottom: 6px; }

    .ps1-green { color: #1E8C3A; }
    .ps1-text  { color: #1C1C1E; }

    #prompts { margin-bottom: 6px; }

    .prompt-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 1px 16px;
      margin-left: -16px;
      width: calc(100% + 32px);
      background: none;
      border: none;
      color: #1C1C1E;
      font-family: inherit;
      font-size: inherit;
      font-weight: inherit;
      line-height: inherit;
      letter-spacing: inherit;
      text-align: left;
      cursor: default;
    }
    .prompt-item:hover,
    .prompt-item.default-active { background: rgba(0,0,0,0.05); }
    .prompt-item .arrow { width: 12px; flex-shrink: 0; color: #1E8C3A; }

    #messages { margin-bottom: 2px; }
    .msg { margin-bottom: 2px; }

    #input-line { display: flex; align-items: center; }
    #input-line input {
      background: transparent;
      border: none;
      outline: none;
      font-family: inherit;
      font-size: inherit;
      font-weight: inherit;
      line-height: inherit;
      letter-spacing: inherit;
      color: #1C1C1E;
      caret-color: #1C1C1E;
      cursor: default;
      width: 0;
      min-width: 1px;
    }

    #cursor {
      display: inline-block;
      width: 1px;
      height: 14px;
      background: #1C1C1E;
      vertical-align: text-bottom;
      margin-left: 1px;
      flex-shrink: 0;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  </style>
</head>
<body>

  <div id="window">
    <!-- Title bar -->
    <div id="titlebar">
      <span>martta@askHerAnything — zsh</span>
    </div>

    <!-- Terminal content -->
    <div id="terminal">
      <div class="last-login" id="last-login">Last login: … from …</div>

      <div class="greeting">
        <span class="ps1-green">martta</span><span class="ps1-text">@askHerAnything ~ % </span><span>ask me anything about Martta Xu.</span>
      </div>

      <div id="prompts"></div>
      <div id="messages"></div>
      <div id="prompts-after"></div>

      <div id="input-line">
        <span class="ps1-green">martta</span><span class="ps1-text">@askHerAnything ~ % </span>
        <input id="input" type="text" autocomplete="off" spellcheck="false" />
        <span id="cursor"></span>
      </div>
    </div>
  </div>

  <script>
    const PROMPTS = [
      "What do you design?",
      "What are you working on?",
      "Where are you based?",
      "How can I reach you?",
    ];

    const RESPONSES = {
      design:   "I'm a product designer focused on the intersection of AI and workflow tools. I care a lot about how software feels to use - not just how it looks.",
      working:  "Right now I'm designing at Datalign, building conversational data analysis tools that replace traditional BI dashboards. Small team - I own end-to-end design.",
      based:    "I'm based in Boston, studying at Northeastern University. Graduating April 2026.",
      contact:  "Best way is email - martta.xu@outlook.com. I'm also on LinkedIn and read every message.",
      school:   "I study at Northeastern University - combined major in Design and Computer Science. Graduating April 2026.",
      tools:    "Figma for everything visual. Framer and Next.js when I need to prototype in the browser. I write just enough code to know what's buildable.",
      fallback: "Good question - but I didn't pre-program that one. Try martta.xu@outlook.com if you're genuinely curious.",
    };

    function getResponse(q) {
      q = q.toLowerCase();
      if (/design|designer|what do you do/.test(q)) return RESPONSES.design;
      if (/working on|project|datalign|current/.test(q))  return RESPONSES.working;
      if (/based|location|where|city|boston/.test(q))     return RESPONSES.based;
      if (/contact|email|reach|hire|talk/.test(q))        return RESPONSES.contact;
      if (/school|study|northeastern|nu|education/.test(q)) return RESPONSES.school;
      if (/tool|figma|software|stack|code/.test(q))       return RESPONSES.tools;
      return RESPONSES.fallback;
    }

    (function setLastLogin() {
      const d = new Date();
      const ts = d.toLocaleString('en-US', {
        weekday:'short', month:'short', day:'numeric',
        hour:'2-digit', minute:'2-digit', second:'2-digit', hour12: false
      }).replace(',','');
      document.getElementById('last-login').textContent = `Last login: ${ts} from ttys003`;
      fetch('https://ipapi.co/json/')
        .then(r => r.json())
        .then(d => { if (d.city) document.getElementById('last-login').textContent = `Last login: ${ts} from ${d.city}`; })
        .catch(() => {});
    })();

    let hasHovered = false;
    let started = false;
    let isTyping = false;

    function buildPromptButtons(container) {
      container.innerHTML = '';
      PROMPTS.forEach((p, i) => {
        const btn = document.createElement('button');
        btn.className = 'prompt-item' + (i === 0 && !hasHovered ? ' default-active' : '');
        btn.innerHTML = `<span class="arrow">${i === 0 && !hasHovered ? '❯' : ' '}</span>${p}`;
        btn.addEventListener('mouseenter', () => {
          if (!hasHovered) { hasHovered = true; buildPromptButtons(container); }
          btn.querySelector('.arrow').textContent = '❯';
          btn.classList.add('default-active');
        });
        btn.addEventListener('mouseleave', () => {
          btn.querySelector('.arrow').textContent = ' ';
          btn.classList.remove('default-active');
        });
        btn.addEventListener('click', () => send(p));
        container.appendChild(btn);
      });
    }
    buildPromptButtons(document.getElementById('prompts'));

    const messagesEl    = document.getElementById('messages');
    const promptsAfterEl = document.getElementById('prompts-after');
    const inputEl       = document.getElementById('input');
    const cursorEl      = document.getElementById('cursor');
    const promptsEl     = document.getElementById('prompts');
    const terminalEl    = document.getElementById('terminal');

    terminalEl.addEventListener('click', () => inputEl.focus());
    inputEl.addEventListener('focus', () => cursorEl.style.display = 'none');
    inputEl.addEventListener('blur',  () => cursorEl.style.display = 'inline-block');
    inputEl.addEventListener('input', () => { inputEl.style.width = Math.max(0, inputEl.value.length) + 'ch'; });
    inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') send(inputEl.value); });

    function ps1() {
      return `<span class="ps1-green">martta</span><span class="ps1-text">@askHerAnything ~ % </span>`;
    }

    function send(text) {
      text = text.trim();
      if (!text || isTyping) return;
      isTyping = true;
      started = true;
      promptsEl.innerHTML = '';
      promptsAfterEl.innerHTML = '';
      inputEl.value = '';
      inputEl.style.width = '0ch';

      const userDiv = document.createElement('div');
      userDiv.className = 'msg';
      userDiv.innerHTML = ps1() + escHtml(text);
      messagesEl.appendChild(userDiv);

      setTimeout(() => {
        const response = getResponse(text);
        const botDiv = document.createElement('div');
        botDiv.className = 'msg';
        messagesEl.appendChild(botDiv);

        let i = 0;
        const interval = setInterval(() => {
          i++;
          botDiv.textContent = response.slice(0, i);
          if (i >= response.length) {
            clearInterval(interval);
            isTyping = false;
            buildPromptButtons(promptsAfterEl);
          }
        }, 18);
      }, 150);
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  </script>
</body>
</html>
